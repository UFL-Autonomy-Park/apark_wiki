site_name: Autonomy Park - Wiki
theme:
  name: material
  favicon: images/index/favicon.ico
  logo: images/index/apark-logo.png
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.tabs
    - navigation.sections
extra:
  generator: false
extra_css:
  - stylesheets/extra.css
hooks:
  - hooks/page_meta.py
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - codehilite
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: snippets
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.pathconverter:
      base_path: "apark-wiki" # default: ''
      relative_path: "" # default ''
      absolute: false # default: false
      tags: "a script img link object embed"
plugins:
  - mkdocs-pdf
  - glightbox
  - search
nav:
  - Home: index.md
  - Start Here:
      - Start Here: start-here/start-here.md
      - Contacts: start-here/contacts.md
      - Safety: start-here/safety.md
